<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen
bg-gradient-to-br from-green-300 via-emerald-200 to-lime-100">

<div class="bg-white p-10 rounded-lg shadow-lg w-96">

<h2 class="text-2xl font-bold mb-6 text-center">
Reset Password
</h2>

<form method="POST" class="space-y-4">

<input type="password"
name="password"
placeholder="New Password"
required
class="w-full border p-3 rounded">

<input type="password"
name="confirm_password"
placeholder="Confirm Password"
required
class="w-full border p-3 rounded">

<button class="bg-green-600 text-white w-full py-3 rounded hover:bg-green-700 transition duration-300">
Update Password
</button>

</form>

</div>

</body>
</html>
