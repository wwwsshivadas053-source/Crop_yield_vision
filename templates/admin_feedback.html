<!DOCTYPE html>
<html>
<head>

<title>Feedback</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="flex">

<div class="w-72 min-h-screen bg-green-800 text-white">

<div class="p-6 text-3xl font-bold">
🌱 YieldVision
</div>

<nav class="p-5">

<a href="/admin/dashboard"
class="block p-3 hover:bg-green-900 rounded">
Dashboard
</a>

<a href="/admin/users"
class="block p-3 hover:bg-green-900 rounded">
Users
</a>

<a href="/admin/predictions"
class="block p-3 hover:bg-green-900 rounded">
Predictions
</a>

<a href="/admin/feedback"
class="block p-3 bg-green-900 rounded">
Feedback
</a>

<a href="/admin/logout"
class="block p-3 mt-10 bg-red-600 rounded">
Logout
</a>

</nav>

</div>

<div class="flex-1 p-8">

<h1 class="text-4xl font-bold mb-6">
Feedback Management
</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

{% for review in reviews %}

<div class="bg-white rounded-2xl shadow-lg p-6">

<h2 class="font-bold text-xl">
{{ review.name }}
</h2>

<p class="text-gray-500">
{{ review.email }}
</p>

<div class="mt-3 text-yellow-500 text-xl">

{% for i in range(review.rating|int) %}
⭐
{% endfor %}

</div>

<p class="mt-4 text-gray-700">
{{ review.message }}
</p>

</div>

{% endfor %}

</div>

</div>

</div>

</body>
</html>
