<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-green-700 via-green-500 to-yellow-300">

<div class="bg-white shadow-2xl rounded-3xl w-full max-w-md p-10">

<h1 class="text-4xl font-bold text-center text-green-700 mb-2">
🌱 YieldVision
</h1>

<p class="text-center text-gray-500 mb-8">
Admin Control Panel
</p>

<form method="POST">

<div class="mb-5">

<label class="font-semibold">
Username
</label>

<input
type="text"
name="username"
required
class="w-full border p-3 rounded-lg mt-2"
/>

</div>

<div class="mb-5">

<label class="font-semibold">
Password
</label>

<input
type="password"
name="password"
required
class="w-full border p-3 rounded-lg mt-2"
/>

</div>

<button
class="w-full bg-green-700 hover:bg-green-800 text-white p-3 rounded-lg font-bold">

Login

</button>

</form>

<a href="/"
class="block text-center mt-5 text-blue-600 font-semibold">

Back To User Login

</a>

</div>

</body>
</html>
